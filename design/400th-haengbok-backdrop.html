<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5.0.19/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5.0.19/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.13/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.13/500-italic.css">
<style>
  :root{
    --ivory:#F7F1E8; --cream:#EFE3D1; --orange:#E2763A; --orange-d:#B9531E;
    --navy:#1D2742; --slate:#56607A; --gold:#C8A36A;
  }
  html,body{margin:0;padding:0;background:var(--ivory)}
  .stage{position:relative;width:3200px;height:1600px;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 70% at 28% 38%, #FFFDF9 0%, rgba(255,253,249,0) 70%),
      radial-gradient(ellipse 55% 65% at 78% 42%, #FBF4EA 0%, rgba(251,244,234,0) 70%),
      linear-gradient(180deg,#F8F2E9 0%,#F2E8DA 100%);
    font-family:'Pretendard',sans-serif;}
  svg.art{position:absolute;inset:0;font-variant-numeric:lining-nums}
  .eyebrow,.en{font-variant-numeric:lining-nums}
  .copy{position:absolute;left:250px;top:330px;color:var(--navy)}
  .eyebrow{display:flex;align-items:center;gap:28px;font-family:'Cormorant Garamond',serif;
    font-weight:600;font-size:40px;letter-spacing:.42em;color:var(--orange-d)}
  .eyebrow i{display:block;width:90px;height:2px;background:var(--orange-d)}
  .title{margin-top:58px;font-family:'Noto Serif KR',serif;font-weight:700;font-size:168px;
    line-height:1.08;letter-spacing:-.02em;color:var(--navy);
    text-shadow:0 2px 0 rgba(255,255,255,.7), 0 18px 34px rgba(29,39,66,.12)}
  .title .num{color:var(--orange);font-family:'Noto Serif KR',serif}
  .title .sm{font-size:150px}
  .rule{margin-top:62px;width:640px;height:3px;
    background:linear-gradient(90deg,var(--gold),rgba(200,163,106,0))}
  .sub{margin-top:46px;font-family:'Noto Serif KR',serif;font-weight:500;font-size:62px;
    letter-spacing:.08em;color:var(--slate)}
  .en{margin-top:30px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:46px;letter-spacing:.06em;color:#8C7B66}
  .frame{position:absolute;inset:56px;border:2px solid rgba(200,163,106,.45);pointer-events:none}
  .frame:after{content:"";position:absolute;inset:14px;border:1px solid rgba(200,163,106,.25)}
</style></head>
<body>
<div class="stage">
<svg class="art" width="3200" height="1600" viewBox="0 0 3200 1600">
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5A3A20" flood-opacity=".22"/>
    </filter>
    <filter id="shs" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5A3A20" flood-opacity=".25"/>
    </filter>
    <filter id="numsh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="18" dy="34" stdDeviation="28" flood-color="#3B2412" flood-opacity=".28"/>
    </filter>
    <linearGradient id="gO" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A066"/><stop offset=".55" stop-color="#E2763A"/><stop offset="1" stop-color="#C65F27"/>
    </linearGradient>
    <linearGradient id="gN" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A4563"/><stop offset="1" stop-color="#1D2742"/>
    </linearGradient>
    <linearGradient id="gI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF7"/><stop offset="1" stop-color="#EFE4D3"/>
    </linearGradient>
    <linearGradient id="gG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C895"/><stop offset=".5" stop-color="#C8A36A"/><stop offset="1" stop-color="#A9824A"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3A46C"/><stop offset=".45" stop-color="#E57C40"/><stop offset="1" stop-color="#C9602A"/>
    </linearGradient>
    <linearGradient id="faceN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36425F"/><stop offset="1" stop-color="#1A2340"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Layered wave bands (paper-cut depth), back to front -->
  <g>
    <path filter="url(#sh)" fill="url(#gI)"
      d="M0 1180 C 520 1090, 980 1260, 1500 1150 S 2400 900, 3200 860 L3200 1600 L0 1600 Z"/>
    <path filter="url(#sh)" fill="url(#gN)"
      d="M0 1290 C 560 1200, 1020 1350, 1560 1250 S 2460 1010, 3200 990 L3200 1032 C 2480 1060, 2000 1240, 1560 1300 S 560 1260, 0 1340 Z"/>
    <path filter="url(#sh)" fill="url(#gO)"
      d="M0 1340 C 560 1260, 1040 1400, 1580 1310 S 2480 1070, 3200 1050 L3200 1130 C 2500 1150, 2020 1330, 1580 1390 S 560 1340, 0 1420 Z"/>
    <path filter="url(#shs)" fill="url(#gG)"
      d="M0 1436 C 560 1360, 1040 1490, 1590 1410 S 2490 1170, 3200 1152 L3200 1162 C 2500 1182, 2020 1420, 1590 1424 S 560 1376, 0 1448 Z"/>
    <path filter="url(#sh)" fill="url(#gI)"
      d="M0 1470 C 600 1400, 1080 1520, 1620 1450 S 2500 1220, 3200 1200 L3200 1600 L0 1600 Z"/>
  </g>

  <!-- Large dimensional 400 -->
  <g transform="translate(1835,1040)" font-family="'Cormorant Garamond',serif" font-weight="600" font-size="860" letter-spacing="-20">
    <!-- extrusion -->
    <g fill="#9C4718">
      <text x="22" y="22">400</text><text x="20" y="20">400</text><text x="18" y="18">400</text>
      <text x="16" y="16">400</text><text x="14" y="14">400</text><text x="12" y="12">400</text>
      <text x="10" y="10">400</text><text x="8" y="8">400</text><text x="6" y="6">400</text>
      <text x="4" y="4">400</text><text x="2" y="2">400</text>
    </g>
    <text x="22" y="22" fill="#000" opacity="0" filter="url(#numsh)">400</text>
    <text x="0" y="0" fill="url(#face)">400</text>
    <text x="0" y="0" fill="url(#shine)">400</text>
    
  </g>

  <!-- ribbon sweeping in front of the numerals -->
  <path filter="url(#sh)" fill="none" stroke="url(#gN)" stroke-width="40" d="M-40 1272 C 520 1190, 1040 1290, 1580 1190 S 2380 900, 2700 852 S 3060 800, 3240 784"/>
  <path filter="url(#shs)" fill="none" stroke="url(#gG)" stroke-width="9" transform="translate(0,34)" d="M-40 1272 C 520 1190, 1040 1290, 1580 1190 S 2380 900, 2700 852 S 3060 800, 3240 784"/>

  <!-- small medallion -->
  <g transform="translate(2840,300)">
    <circle r="92" fill="none" stroke="url(#gG)" stroke-width="3"/>
    <circle r="78" fill="none" stroke="#C8A36A" stroke-opacity=".5" stroke-width="1.5"/>
    <text y="-14" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-weight="600" font-size="30" letter-spacing="6" fill="#A9824A">THE</text>
    <text y="34" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-weight="600" font-size="52" fill="#B9531E">400<tspan font-size="28" dy="-18">th</tspan></text>
  </g>
</svg>

<div class="frame"></div>
<div class="copy">
  <div class="eyebrow"><i></i>THE 400TH CELEBRATION</div>
  <div class="title"><span class="num">400</span><span class="sm">회</span><br>행복씨대화</div>
  <div class="rule"></div>
  <div class="sub">끝나지 않을 우리의 이야기</div>
  <div class="en">Our story, never ending.</div>
</div>
</div>
</body></html>
